name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  container:
    name: Container
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./
          file: ./container/Containerfile
          push: false
          load: true
          tags: cadence:ci
          # prevent different architectures overwriting each other's cache
          cache-from: type=gha,scope=cadence-${{ runner.arch }}
          cache-to: type=gha,scope=cadence-${{ runner.arch }},mode=max

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
      - run: docker run --detach --name cadence-ci --publish 127.0.0.1:8080:80 cadence:ci
      - run: npm run container-test
      - if: always()
        run: docker logs cadence-ci
      - if: always()
        run: docker rm --force cadence-ci || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run test

  test-browser:
    name: Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
