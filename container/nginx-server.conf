map $sent_http_content_type $expires {
    default                     off;

    ~*^text/html                epoch;
    ~*^text/markdown            epoch;
    ~*^text/css                 max;
    ~*^application/javascript   max;
    ~*^text/javascript          max;

    ~*^image/svg\+xml           max;
    ~*^image/x-icon             max;
    ~*^image/png                max;
    ~*^image/jpeg               max;
    ~*^image/gif                max;
    ~*^image/bmp                max;

    ~*^font/ttf                 max;
    ~*^font/woff                max;
    ~*^font/otf                 max;
    ~*^font/woff2               max;
    ~*^application/vnd\.ms-fontobject max;
}

types {
    text/markdown md;
}

server {
    listen       80;
    server_name  localhost;

    charset utf-8;

    charset_types
        text/html
        text/markdown
        text/css
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    set $csp_nonce $request_id;

    set $csp "default-src 'self';";
    set $csp "$csp script-src 'self';";
    set $csp "$csp style-src 'self' 'nonce-$csp_nonce';";
    set $csp "$csp img-src 'self' data:;";
    set $csp "$csp font-src 'self';";
    set $csp "$csp connect-src 'self' http: https:;";
    set $csp "$csp frame-ancestors 'none';";
    set $csp "$csp base-uri 'self';";
    set $csp "$csp form-action 'self';";

    add_header Content-Security-Policy $csp;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;

        sub_filter '</head>' '<meta name="csp-nonce" content="$csp_nonce"></head>';

        expires $expires;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
